name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python -m pytest tests -q -m "not integration" -k "not test_wsl_availability_is_reported_not_assumed" --tb=short -o faulthandler_timeout=60 --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
